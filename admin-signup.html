<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Admin Account</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Poppins,Arial,sans-serif;
  background:url("dirtbowl.jpg") center/cover no-repeat fixed;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:-1;
}

.signup-card{
  width:90%;
  max-width:430px;
  background:rgba(15,15,15,.95);
  border:1px solid rgba(255,255,255,.12);
  border-radius:24px;
  padding:30px;
  box-shadow:0 20px 50px rgba(0,0,0,.6);
  text-align:center;
}

.logo{font-size:48px;margin-bottom:10px}
h1{margin:0;font-size:28px}
p{color:#aaa;margin-bottom:24px}

input{
  width:100%;
  padding:14px;
  margin-bottom:12px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.15);
  background:#0b0b0b;
  color:white;
  font-size:15px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:#1da1f2;
  color:white;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

.error{
  color:#ff5c5c;
  margin-top:12px;
  font-size:14px;
  display:none;
}

.success{
  color:#25d366;
  margin-top:12px;
  font-size:14px;
  display:none;
}

.links{margin-top:18px}
.links a{color:#1da1f2;text-decoration:none;font-weight:700}
</style>
</head>

<body>

<div class="signup-card">
  <div class="logo">🏀</div>
  <h1>Create Admin</h1>
  <p>Use your invite code to create an admin account.</p>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <input type="text" id="inviteCode" placeholder="Invite Code">

  <button id="signupBtn">Create Account</button>

  <div class="error" id="errorMsg"></div>
  <div class="success" id="successMsg"></div>

  <div class="links">
    <a href="admin-login.html">Already have an account? Login</a>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  getDatabase,
  ref,
  get,
  set,
  update
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyByXfVkKxz166ghpEVD4xuaQtLDpeNCzUE",
  authDomain: "dirtbowl-page.firebaseapp.com",
  databaseURL: "https://dirtbowl-page-default-rtdb.firebaseio.com",
  projectId: "dirtbowl-page",
  storageBucket: "dirtbowl-page.appspot.com",
  messagingSenderId: "948778986865",
  appId: "1:948778986865:web:0f66d810d77310ec459ad0",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const inviteInput = document.getElementById("inviteCode");
const signupBtn = document.getElementById("signupBtn");
const errorMsg = document.getElementById("errorMsg");
const successMsg = document.getElementById("successMsg");

function showError(msg){
  successMsg.style.display = "none";
  errorMsg.style.display = "block";
  errorMsg.textContent = msg;
}

function showSuccess(msg){
  errorMsg.style.display = "none";
  successMsg.style.display = "block";
  successMsg.textContent = msg;
}

signupBtn.onclick = async () => {
  const email = emailInput.value.trim();
  const password = passwordInput.value;
  const code = inviteInput.value.trim();

  if(!email || !password || !code){
    showError("Fill out email, password, and invite code.");
    return;
  }

  if(password.length < 6){
    showError("Password must be at least 6 characters.");
    return;
  }

  try{
    const codeRef = ref(db, "inviteCodes/" + code);
    const codeSnap = await get(codeRef);

    if(!codeSnap.exists()){
      showError("Invalid invite code.");
      return;
    }

    const codeData = codeSnap.val();

    

    const cred = await createUserWithEmailAndPassword(auth, email, password);

    await set(ref(db, "admins/" + cred.user.uid), {
      email: email,
      role: codeData.role || "admin",
      teamId: codeData.teamId || "",
      createdAt: Date.now()
    });

    

    showSuccess("Admin account created. Redirecting...");

    setTimeout(() => {
      window.location.href = "admin-fixed.html";
    }, 1200);

  }catch(error){
    showError(error.message);
  }
};
</script>

</body>
</html>
