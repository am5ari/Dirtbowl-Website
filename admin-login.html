<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dirtbowl Admin Login</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Poppins,Arial,sans-serif;
  background:url("dirtbowl.jpg") center/cover no-repeat fixed;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:-1;
}

.login-card{
  width:90%;
  max-width:420px;
  background:rgba(15,15,15,.95);
  border:1px solid rgba(255,255,255,.12);
  border-radius:24px;
  padding:30px;
  box-shadow:0 20px 50px rgba(0,0,0,.6);
  text-align:center;
}

.logo{
  font-size:48px;
  margin-bottom:10px;
}

h1{
  margin:0;
  font-size:28px;
}

p{
  color:#aaa;
  margin-bottom:24px;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:12px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.15);
  background:#0b0b0b;
  color:white;
  font-size:15px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:#1da1f2;
  color:white;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

button:hover{
  filter:brightness(1.1);
}

.error{
  color:#ff5c5c;
  margin-top:12px;
  font-size:14px;
  display:none;
}

.links{
  margin-top:18px;
}

.links a{
  color:#1da1f2;
  text-decoration:none;
  font-weight:700;
}
</style>
</head>

<body>

<div class="login-card">
  <div class="logo">🏀</div>
  <h1>Admin Login</h1>
  <p>Dirtbowl Dashboard Access</p>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">

  <button id="loginBtn">Login</button>

  <div class="error" id="errorMsg"></div>

  <div class="links">
    <a href="admin-signup.html">Create admin account</a>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  getDatabase,
  ref,
  get
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyByXfVkKxz166ghpEVD4xuaQtLDpeNCzUE",
  authDomain: "dirtbowl-page.firebaseapp.com",
  databaseURL: "https://dirtbowl-page-default-rtdb.firebaseio.com",
  projectId: "dirtbowl-page",
  storageBucket: "dirtbowl-page.appspot.com",
  messagingSenderId: "948778986865",
  appId: "1:948778986865:web:0f66d810d77310ec459ad0",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const errorMsg = document.getElementById("errorMsg");

function showError(message){
  errorMsg.style.display = "block";
  errorMsg.textContent = message;
}

loginBtn.onclick = async () => {
  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if(!email || !password){
    showError("Enter your email and password.");
    return;
  }

  try{
    const cred = await signInWithEmailAndPassword(auth, email, password);

    const adminSnap = await get(ref(db, "admins/" + cred.user.uid));

    if(!adminSnap.exists()){
      showError("This account is not approved as an admin.");
      return;
    }

    window.location.href = "admin-fixed.html";

  }catch(error){
    showError("Login failed. Check your email and password.");
  }
};

onAuthStateChanged(auth, async (user) => {
  if(user){
    const adminSnap = await get(ref(db, "admins/" + user.uid));

    if(adminSnap.exists()){
      window.location.href = "admin-fixed.html";
    }
  }
});
</script>

</body>
</html>
