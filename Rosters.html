<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Team Rosters</title>

<style>

html, body {
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;

    font-family: poppins, sans-serif;
    overflow-x:hidden;
}


/* Fixed full screen background */
body::before {

    content:"";

    position:fixed;

    top:0;
    left:0;

    width:100vw;
    height:100dvh;

    background-image:url(dirtbowl.jpg);

    background-size:cover;

    background-position:center;

    background-repeat:no-repeat;

    z-index:-1;

}

h1{
 color:#fff;
 text-align:center;
}


/* Your page content */
.container {

    position:relative;

    min-height:100dvh;

    padding:30px;

}

#modalTeamName{
    font-size:30px;
    font-weight:700;
    margin-bottom:20px;
}

.modal-logo{
    width:120px;
    height:120px;
    object-fit:contain;

    display:block;
    margin:0 auto 20px;
}


.team-grid {

    display:grid;

    grid-template-columns:repeat(2, 120px);

    justify-content:center;

    gap:35px;

}


.team-card {

    background:rgba(0,0,0,0.85);

    padding:12px;

    border-radius:12px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    width:120px;

    height:140px;

    cursor:pointer;

    transition:transform .2s;

}


.team-card:hover {

    transform:scale(1.05);

}


.team-card img {

    width:70px;

    height:70px;

    object-fit:contain;

    margin-bottom:8px;

}


.team-card h2 {

    font-size:16px;

    color:white;

    margin:0;

}


.player {

    background:#111;

    opacity:85%;

    color:#fff;

    margin:10px 0;

    padding:10px;

    border-radius:12px;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:20px;

    text-align:center;

}

.modal {

    display:none;

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,.75);

    backdrop-filter:blur(8px);

    z-index:9999;

}


.modal-content{
    background:rgba(15,15,15,.97);

    width:90%;
    max-width:550px;

    max-height:80vh;
    overflow-y:auto;

    border-radius:24px;

    padding:25px;

    position:absolute;
    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    color:white;

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
    0 0 30px rgba(0,0,0,.5);
}


#closeModal {

    position:absolute;

    right:20px;

    top:10px;

    font-size:35px;

    cursor:pointer;

}



.modal-content h1 {

    text-align:center;

}



.modal-player{
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);

    padding:14px 18px;
    margin:10px 0;

    border-radius:14px;

    display:flex;
    align-items:center;
    gap:15px;

    transition:.2s;
}

.modal-player:hover{
    transform:translateY(-2px);
    background:rgba(255,255,255,.08);
}
.modal-logo {

    display:block;

    width:120px;

    height:120px;

    object-fit:contain;

    margin:0 auto 15px;

}

.player-number{
    width:44px;
    height:44px;

    background:#525a61;

    clip-path:polygon(
        25% 0%,
        75% 0%,
        100% 25%,
        85% 40%,
        85% 100%,
        15% 100%,
        15% 40%,
        0% 25%
    );

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;
    font-weight:700;
    font-size:12px;

    flex-shrink:0;
}

.player-name{
    flex:1;
    text-align:left;

    font-size:17px;
    font-weight:600;
}

.home-btn {

    position:fixed;

    top:20px;

    left:20px;

    background:rgba(0,0,0,.75);

    backdrop-filter:blur(10px);

    color:white;

    padding:10px 18px;

    border-radius:25px;

    text-decoration:none;

    font-weight:bold;

    z-index:9999;

    opacity:.85;

    transition:.2s;

}


.home-btn:hover {

    transform:scale(1.05);

    opacity:1;

}



</style>


</head>


<body>

<a href="index.html" class="home-btn">← Home</a>


<div class="container">


<h1 id="pageTitle">
Rosters
</h1>


<div id="teams" class="team-grid"></div>

<div id="rosterModal" class="modal">

    <div class="modal-content">

        <span id="closeModal">&times;</span>

        <img id="modalTeamLogo" class="modal-logo">

        <h1 id="modalTeamName"></h1>

        <div id="modalPlayers"></div>

    </div>

</div>


<div id="roster" style="display:none">


<h1 id="rosterTitle"></h1>


<div id="players"></div>


</div>


</div>



<script type="module">


import {initializeApp} 
from 
"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


import {

getDatabase,

ref,

onValue

}

from

"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";





const firebaseConfig = {
  apiKey: "AIzaSyByXfVkKxz166ghpEVD4xuaQtLDpeNCzUE",
  authDomain: "dirtbowl-page.firebaseapp.com",
  databaseURL: "https://dirtbowl-page-default-rtdb.firebaseio.com",
  projectId: "dirtbowl-page",
  storageBucket: "dirtbowl-page.appspot.com",
  messagingSenderId: "948778986865",
  appId: "1:948778986865:web:0f66d810d77310ec459ad0",
};




const app = initializeApp(firebaseConfig);

const db = getDatabase(app);



const teamsDiv=document.getElementById("teams");

const rosterDiv=document.getElementById("players");



loadTeams();



function loadTeams(){


const teamsRef=ref(db,"teams");


onValue(teamsRef,(snapshot)=>{


teamsDiv.innerHTML="";


snapshot.forEach((teamSnap)=>{


let team = teamSnap.val();

let id = teamSnap.key;



teamsDiv.innerHTML += `


<div class="team-card"
onclick="openRoster('${id}')">


<img src="${team.logoURL || 'logo.png'}">


<h2>
${team.name}
</h2>


</div>


`;


});



});



}





window.openRoster=function(teamID){


const modal=document.getElementById("rosterModal");

const title=document.getElementById("modalTeamName");
const logo=document.getElementById("modalTeamLogo");

const playersDiv=document.getElementById("modalPlayers");



modal.style.display="block";

playersDiv.innerHTML="";



const teamRef=ref(db,"teams/"+teamID);



onValue(teamRef,(snapshot)=>{


let team=snapshot.val();


logo.src = team.logoURL;





});




const playersRef =
ref(db,"teams/"+teamID+"/players");

onValue(playersRef,(snapshot)=>{

    playersDiv.innerHTML="";

    let players = [];

    snapshot.forEach((player)=>{

        players.push({
            id: player.key,
            ...player.val()
        });

    });

    // Sort by jersey number
    players.sort((a,b)=>{
        return Number(a.number ?? 999) - Number(b.number ?? 999);
    });

    players.forEach((data)=>{

        playersDiv.innerHTML += `
<div class="modal-player">

    <div class="player-number">
        ${data.number ?? ""}
    </div>

    <div class="player-name">
        ${data.id}
    </div>

</div>
`;

    });

});


}

document.getElementById("closeModal").onclick=function(){

document.getElementById("rosterModal").style.display="none";

};



</script>


</body>

</html>
