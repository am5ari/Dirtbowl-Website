<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Team Rosters</title>

<style>

html, body {
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;

    font-family: poppins, sans-serif;
    overflow-x:hidden;
}


/* Fixed full screen background */
body::before {

    content:"";

    position:fixed;

    top:0;
    left:0;

    width:100vw;
    height:100dvh;

    background-image:url(dirtbowl.jpg);

    background-size:cover;

    background-position:center;

    background-repeat:no-repeat;

    z-index:-1;

}

h1{
 color:#fff;
 text-align:center;
}


/* Your page content */
.container {

    position:relative;

    min-height:100dvh;

    padding:30px;

}


.team-grid{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(160px,1fr));

    gap:20px;

}


.team-card {
  background: black;
  opacity: 85%;
  padding: 12px;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 120px;
  cursor: pointer;
  transition: transform 0.2s;
}


.team-card:hover { transform: scale(1.05); }

.team-card img {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  object-fit: cover;
  margin-bottom: 8px;
}


.team-card h2{

    font-size:20px;
    color:#fff;

}


.player {

    background:#111;

    opacity:85%;

    color:#fff;

    margin:10px 0;

    padding:10px;

    border-radius:12px;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:20px;

    text-align:center;

}

.modal {

    display:none;

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,.75);

    backdrop-filter:blur(8px);

    z-index:9999;

}


.modal-content {

    background:#111;

    width:90%;

    max-width:500px;

    max-height:80vh;

    overflow-y:auto;

    border-radius:20px;

    padding:25px;

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    color:white;

}


#closeModal {

    position:absolute;

    right:20px;

    top:10px;

    font-size:35px;

    cursor:pointer;

}



.modal-content h1 {

    text-align:center;

}



.modal-player {

    background:#222;

    padding:15px;

    margin:10px 0;

    border-radius:12px;

    display:flex;

    justify-content:center;

    gap:20px;

}

.modal-logo {

    display:block;

    width:120px;

    height:120px;

    object-fit:contain;

    margin:0 auto 15px;

}



</style>


</head>


<body>


<div class="container">


<h1 id="pageTitle">
Rosters
</h1>


<div id="teams" class="team-grid"></div>

<div id="rosterModal" class="modal">

    <div class="modal-content">

        <span id="closeModal">&times;</span>

        <img id="modalTeamLogo" class="modal-logo">

        <h1 id="modalTeamName"></h1>

        <div id="modalPlayers"></div>

    </div>

</div>


<div id="roster" style="display:none">


<h1 id="rosterTitle"></h1>


<div id="players"></div>


</div>


</div>



<script type="module">


import {initializeApp} 
from 
"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


import {

getDatabase,

ref,

onValue

}

from

"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";





const firebaseConfig = {
  apiKey: "AIzaSyByXfVkKxz166ghpEVD4xuaQtLDpeNCzUE",
  authDomain: "dirtbowl-page.firebaseapp.com",
  databaseURL: "https://dirtbowl-page-default-rtdb.firebaseio.com",
  projectId: "dirtbowl-page",
  storageBucket: "dirtbowl-page.appspot.com",
  messagingSenderId: "948778986865",
  appId: "1:948778986865:web:0f66d810d77310ec459ad0",
};




const app = initializeApp(firebaseConfig);

const db = getDatabase(app);



const teamsDiv=document.getElementById("teams");

const rosterDiv=document.getElementById("players");



loadTeams();



function loadTeams(){


const teamsRef=ref(db,"teams");


onValue(teamsRef,(snapshot)=>{


teamsDiv.innerHTML="";


snapshot.forEach((teamSnap)=>{


let team = teamSnap.val();

let id = teamSnap.key;



teamsDiv.innerHTML += `


<div class="team-card"
onclick="openRoster('${id}')">


<img src="${team.logoURL || 'logo.png'}">


<h2>
${team.name}
</h2>


</div>


`;


});



});



}





window.openRoster=function(teamID){


const modal=document.getElementById("rosterModal");

const title=document.getElementById("modalTeamName");
const logo=document.getElementById("modalTeamLogo");

const playersDiv=document.getElementById("modalPlayers");



modal.style.display="block";

playersDiv.innerHTML="";



const teamRef=ref(db,"teams/"+teamID);



onValue(teamRef,(snapshot)=>{


let team=snapshot.val();


logo.src = team.logoURL;





});




const playersRef=
ref(db,"teams/"+teamID+"/players");



onValue(playersRef,(snapshot)=>{


playersDiv.innerHTML="";



snapshot.forEach((player)=>{


let data=player.val();



playersDiv.innerHTML += `


<div class="modal-player">


<span>
${player.key}
</span>


<span>
#${data.number || ""}
</span>


</div>


`;


});


});


}

document.getElementById("closeModal").onclick=function(){

document.getElementById("rosterModal").style.display="none";

};



</script>


</body>

</html>
