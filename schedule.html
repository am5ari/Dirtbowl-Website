<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dirtbowl Schedule</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0b0b;
  --card: #111;
  --accent: #1da1f2;
  --white: #fff;
}


/* Reset */
html, body {
  margin: 0;
  padding: 0;
  font-family: 'Poppins', sans-serif;
  height: 100%;
  width: 100%;
  overflow-x: hidden;
}

/* Full-screen background wrapper */
.bg-wrapper {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100dvh; /* dynamic viewport height for mobile */
  background: url(dirtbowl.jpg) center center / cover no-repeat;
  z-index: -1; /* behind all content */
}

/* Body content */
body {
  
   /* ✅ prevents vertical cutoff */
  min-height: 100dvh;
  padding: 20px;
  box-sizing: border-box;
  color: var(--white);
}

/* Main container */
.container {
    max-width: 1000px;
    width: 100%;
    margin: 90px auto 0 auto;

    display: flex;
    flex-direction: column;
    align-items: center;
}

.container h1 {
  color: black;
  opacity: 85%;
  -webkit-text-stroke: #fff 1px;
  text-align: center;
}

#upcomingGamesNav {
    position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);

    z-index: 9999;

    display: flex;
    align-items: center;

    width: fit-content;
    max-width: 90vw;

    overflow: hidden;

    background: rgba(15, 15, 15, 0.85);
    backdrop-filter: blur(12px);

    border: 1px solid rgba(255,255,255,.15);
    border-radius: 999px;

    padding: 10px 20px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.08);
}

#upcomingGamesTrack {
    display: flex;
    align-items: center;
    gap: 40px;

    white-space: nowrap;

    animation: scrollGames 50s linear infinite;
}

@keyframes scrollGames {
    from {
        transform: translateX(0%);
    }
    to {
        transform: translateX(-50%);
    }
}

.gameTickerItem {
    display: flex;
    align-items: center;
    gap: 8px;

    color: white;
    font-size: 13px;
    font-weight: 600;
}

.gameTickerItem img {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    object-fit: cover;
}

.upcomingGameCard {
    display: flex;
    align-items: center;
    gap: 8px;

    background: transparent;
    border: none;

    color: white;
    font-size: 14px;
    white-space: nowrap;

    padding: 4px 8px;
    cursor: pointer;
}

.upcomingGameCard img {
    width: 20px;
    height: 20px;
    border-radius: 50%;
}

/* Buttons & modals */
#adminLoginBtn {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 9999;
  padding: 8px 12px;
  border-radius: 6px;
  border: none;
  background: white;
  opacity: 50%;
  color: #000;
  cursor: pointer;
}

#loginModal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  align-items: center;
  justify-content: center;
  z-index: 10000;
}

#loginModal > div {
  background: #111;
  padding: 20px;
  border-radius: 12px;
  width: 90%;
  max-width: 320px;
}

#teamsContainer {
  display: flex;
  flex-wrap: wrap;
  justify-content: center; /* ✅ centers horizontally */
  align-items: center;
  gap: 16px;
  margin-top: 20px;
  width: 100%;
}

.teamCard {
  background: var(--card);
  opacity: 85%;
  padding: 12px;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 120px;
  cursor: pointer;
  transition: transform 0.2s;
}

.teamCard:hover { transform: scale(1.05); }

.teamCard img {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  object-fit: cover;
  margin-bottom: 8px;
}

/* Schedule list */
.scheduleList {
  margin-top: 20px;
  background: var(--card);
  opacity: 85%;
  padding: 12px;
  border-radius: 12px;
  width: 100%;
}

.scheduleList h3 { margin-top: 0; margin-bottom: 10px; }

input, select, textarea, button {
  font-family: 'Poppins', sans-serif;
  margin-bottom: 8px;
}

input, select, textarea {
  width: 100%;
  padding: 8px;
  border-radius: 6px;
  border: 1px solid #333;
  background: #222;
  color: #fff;
}

button {
  padding: 8px 12px;
  border: none;
  border-radius: 6px;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
}

/* Admin panel */
#adminPanel {
  display: none;
  margin-top: 20px;
  background: #222;
  padding: 12px;
  border-radius: 12px;
  width: 100%;
}

/* Schedule rows */
.scheduleRow {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
  align-items: center;
}

.scheduleRow select,
.scheduleRow input { flex: 1; }

/* Responsive */
@media screen and (max-width: 960px) {
  .container { width: 90%; }
}

@media screen and (max-width: 740px) {
  .container { width: 95%; }
  .container h1 { text-align: center; }
  #adminLoginBtn { display: none; }
}

.teamCard {
  width: 140px; /* slightly bigger for desktop */
}

/* ✅ MOBILE FIX */
@media screen and (max-width: 600px) {
  #teamsContainer {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    justify-items: center;
  }

  .teamCard {
    width: 100%;
    max-width: 80px;
  
  }

}




</style>
</head>
<body>

<div class="bg-wrapper"></div>
<div id="upcomingGamesNav">
    <div id="upcomingGamesTrack"></div>
</div>
<div id="todayGamesNav"></div>
<button id="adminLoginBtn">Admin Login</button>

<div id="loginModal">
  <div>
    <h3>Admin Login</h3>
    <input id="adminEmail" type="email" placeholder="Email">
    <input id="adminPass" type="password" placeholder="Password">
    <div style="display:flex; justify-content:flex-end; gap:8px;">
      <button id="loginCancel">Cancel</button>
      <button id="loginSubmit">Login</button>
    </div>
    <p id="loginError" style="color:#ff8b8b; display:none;"></p>
  </div>
</div>



<div class="container">
  <h1>Team Schedules</h1>
  <div id="teamsContainer"></div>
  
  <div class="scheduleList" id="scheduleList">
    <h3>Schedule</h3>
    <div id="scheduleContent">Click a team to view their schedule.</div>
  </div>
<div id="adminPanel">
  <h3>Admin Panel — Build Schedule</h3>

  <!-- Add New Team -->
  <h4>Add New Team</h4>
  <div id="addTeamForm" style="display:flex; flex-direction:column; gap:8px; margin-bottom:12px;">
    <input id="newTeamName" type="text" placeholder="Team Name">
    <input id="newTeamLogo" type="file" accept="image/*">
    <img id="logoPreview" src="" style="width:80px;height:80px;border-radius:50%;display:none;margin-bottom:8px;">
    <button id="addTeamBtn">Add Team</button>
  </div>

  <!-- Schedule Builder -->
  <h4>Build Team Schedule</h4>
  <div id="scheduleBuilder"></div>
  <button id="addGameBtn">Add Game</button>
  <button id="saveScheduleBtn">Save Schedule</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyByXfVkKxz166ghpEVD4xuaQtLDpeNCzUE",
  authDomain: "dirtbowl-page.firebaseapp.com",
  databaseURL: "https://dirtbowl-page-default-rtdb.firebaseio.com",
  projectId: "dirtbowl-page",
  storageBucket: "dirtbowl-page.appspot.com",
  messagingSenderId: "948778986865",
  appId: "1:948778986865:web:0f66d810d77310ec459ad0",
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let isAdmin = false;
let teams = {};

// Admin login
const adminLoginBtn = document.getElementById('adminLoginBtn');
const loginModal = document.getElementById('loginModal');
const loginCancel = document.getElementById('loginCancel');
const loginSubmit = document.getElementById('loginSubmit');
const loginError = document.getElementById('loginError');
const adminPanel = document.getElementById('adminPanel');

adminLoginBtn.addEventListener('click', () => loginModal.style.display='flex');
loginCancel.addEventListener('click', () => { loginModal.style.display='none'; loginError.style.display='none'; });

loginSubmit.addEventListener('click', async () => {
    const email = document.getElementById('adminEmail').value.trim();
    const pass = document.getElementById('adminPass').value;
    loginError.style.display='none';
    if(!email||!pass){ loginError.textContent='Enter credentials'; loginError.style.display='block'; return; }
    try{
        await auth.signInWithEmailAndPassword(email, pass);
        isAdmin = true;
        adminPanel.style.display='block';
        loginModal.style.display='none';
        adminLoginBtn.style.display='none';
        loadTeams();
    }catch(err){
        loginError.textContent='Login failed: '+err.message;
        loginError.style.display='block';
    }
});

function formatTime(time) {
    if (!time) return 'TBD';

    const [hours, minutes] = time.split(':');
    const date = new Date();
    date.setHours(hours);
    date.setMinutes(minutes);

    return date.toLocaleTimeString([], {
        hour: 'numeric',
        minute: '2-digit'
    });
}


function getScheduleArray(schedule){
  if (!schedule) return [];
  return Array.isArray(schedule) ? schedule : Object.values(schedule);
}

// Load teams from Firebase
async function loadTeams(){
    const snapshot = await db.ref('teams').get();
    if(snapshot.exists()){
        teams = snapshot.val();
    } else {
        // Default teams if none exist
        teams = {
        };
    }
    displayTeams();
    buildScheduleUI();
    
    displayUpcomingGames();
}

// Display teams
function displayTeams(){
    const container = document.getElementById('teamsContainer');
    container.innerHTML='';
    for(const key in teams){
        const team = teams[key];
        const div = document.createElement('div');
        div.className='teamCard';
        div.innerHTML=`<img src="${team.logoURL}" alt="${team.name}"><span>${team.name}</span>`;
        div.onclick=()=>showTeamSchedule(key);
        container.appendChild(div);
    }
}

// Show schedule with logos
const scheduleContent = document.getElementById('scheduleContent');

function showTeamSchedule(teamId){
    const schedule = teams[teamId].schedule || [];
    scheduleContent.innerHTML='';
    schedule.forEach(game=>{
        const div = document.createElement('div');
        div.style.display='flex';
        div.style.alignItems='center';
        div.style.gap='8px';

        const homeTeam = Object.values(teams).find(t=>t.name===game.home);
        const awayTeam = Object.values(teams).find(t=>t.name===game.away);

        const homeDiv=document.createElement('div');
        homeDiv.style.display='flex'; homeDiv.style.alignItems='center';
        const homeLogo = document.createElement('img'); homeLogo.src=homeTeam.logoURL;
        homeLogo.style.width='24px'; homeLogo.style.height='24px'; homeLogo.style.borderRadius='50%';
        homeDiv.appendChild(homeLogo);
        homeDiv.appendChild(document.createTextNode(' '+homeTeam.name));

        const awayDiv=document.createElement('div');
        awayDiv.style.display='flex'; awayDiv.style.alignItems='center';
        const awayLogo = document.createElement('img'); awayLogo.src=awayTeam.logoURL;
        awayLogo.style.width='24px'; awayLogo.style.height='24px'; awayLogo.style.borderRadius='50%';
        awayDiv.appendChild(awayLogo);
        awayDiv.appendChild(document.createTextNode(' '+awayTeam.name));

        div.appendChild(document.createTextNode(game.date+' - '));
        div.appendChild(homeDiv);
        div.appendChild(document.createTextNode(' vs '));
        div.appendChild(awayDiv);
        div.appendChild(document.createTextNode(` (${game.score||'TBD'})`));

        scheduleContent.appendChild(div);
    });
}

// Admin Schedule Builder
const scheduleBuilder = document.getElementById('scheduleBuilder');
document.getElementById('addGameBtn').addEventListener('click', addGameRow);
document.getElementById('saveScheduleBtn').addEventListener('click', saveSchedule);

function buildScheduleUI() {
    scheduleBuilder.innerHTML = '';

    const addedGames = new Set();
    const allGames = [];

    // Collect all unique games
    for (const key in teams) {
        const schedule = getScheduleArray(teams[key].schedule);

        schedule.forEach(game => {

            const gameId =
                `${game.date}-${game.time || ''}-${game.home}-${game.away}`;

            if (addedGames.has(gameId)) return;

            addedGames.add(gameId);
            allGames.push(game);
        });
    }

    // Sort by date and time
    allGames.sort((a, b) => {
        const dateA = new Date(`${a.date}T${a.time || '00:00'}`);
        const dateB = new Date(`${b.date}T${b.time || '00:00'}`);
        return dateA - dateB;
    });

    // Build rows in order
    allGames.forEach(game => {
        addGameRow(game);
    });

    // Show one blank row if no games exist
    if (allGames.length === 0) {
        addGameRow();
    }
}

function addGameRow(game=null){
    const row = document.createElement('div'); row.className='scheduleRow';
    const dateInput = document.createElement('input'); dateInput.type='date'; dateInput.value=game?.date||'';
    const timeInput = document.createElement('input');
timeInput.type = 'time';
timeInput.value = game?.time || '';
    const homeSelect = document.createElement('select'); 
    const awaySelect = document.createElement('select');
    for(const key in teams){
        const opt = document.createElement('option');
        opt.value=teams[key].name; opt.textContent=teams[key].name;
        homeSelect.appendChild(opt.cloneNode(true));
        awaySelect.appendChild(opt.cloneNode(true));
    }
    if(game){ homeSelect.value=game.home; awaySelect.value=game.away; }
    const scoreInput = document.createElement('input'); scoreInput.placeholder='Score'; scoreInput.value=game?.score||'';

    const removeBtn = document.createElement('button'); removeBtn.textContent='X';
    removeBtn.onclick=()=>row.remove();

    row.appendChild(dateInput); row.appendChild(timeInput); row.appendChild(homeSelect); row.appendChild(awaySelect); row.appendChild(scoreInput); row.appendChild(removeBtn);
    scheduleBuilder.appendChild(row);
}

function formatDate(dateStr) {
    const [year, month, day] = dateStr.split('-');

    return new Date(year, month - 1, day)
        .toLocaleDateString('en-US', {
            month: 'short',
            day: 'numeric'
        });
}

// 1. Show a team's schedule

function showTeamSchedule(teamId){
    const scheduleContent = document.getElementById('scheduleContent');

    // make a COPY so we don't touch Firebase data
    const schedule = [...getScheduleArray(teams[teamId].schedule)];;

    // sort by date + time
    schedule.sort((a, b) => {
        const dateA = new Date(`${a.date}T${a.time || '00:00'}`);
        const dateB = new Date(`${b.date}T${b.time || '00:00'}`);
        return dateA - dateB;
    });

    scheduleContent.innerHTML = '';

    schedule.forEach(game => {

        const homeTeam = Object.values(teams).find(t => t.name === game.home);
        const awayTeam = Object.values(teams).find(t => t.name === game.away);

        const div = document.createElement('div');
        div.className = 'scheduleGame';

        div.innerHTML = `
            <strong>${formatDate(game.date)}</strong> - ${formatTime(game.time)}
            <br>
            <img src="${homeTeam.logoURL}" style="width:24px;height:24px;border-radius:50%;vertical-align:middle;">
            ${game.home}
            vs
            <img src="${awayTeam.logoURL}" style="width:24px;height:24px;border-radius:50%;vertical-align:middle;">
            ${game.away}
        `;

        scheduleContent.appendChild(div);
    });
}

// 2. Display Teams (team cards)
function displayTeams(){
    const container = document.getElementById('teamsContainer');
    container.innerHTML = '';
    Object.keys(teams).forEach(key=>{
        const t = teams[key];
        const div = document.createElement('div');
        div.className = 'teamCard';
        div.innerHTML = `<img src="${t.logoURL}" alt="${t.name}"><div>${t.name}</div>`;
        div.addEventListener('click', ()=>{
            showTeamSchedule(key);
            document.getElementById('scheduleList').scrollIntoView({behavior:'smooth'});
        });
        container.appendChild(div);
    });
}

// 3. Display Today Games (navbar)
function displayTodayGames() {
    const nav = document.getElementById('todayGamesNav');
    nav.innerHTML = '';
    const todayStr = new Date().toISOString().slice(0,10);
    const addedGames = new Set(); // to track displayed games

    for (const key in teams) {
        const gamesToday = getScheduleArray(teams[key].schedule).filter(g => g.date === todayStr);
        gamesToday.forEach(game => {
            // Create a unique identifier for the game
            const gameId = [game.home, game.away, game.date].sort().join('|');
            if (addedGames.has(gameId)) return; // skip if already added
            addedGames.add(gameId);

            const btn = document.createElement('button'); 
            btn.className = 'todayGameBtn';

            const homeTeam = Object.values(teams).find(t => t.name === game.home);
            const awayTeam = Object.values(teams).find(t => t.name === game.away);

           btn.innerHTML = `
    <img src="${homeTeam.logoURL}">
    ${homeTeam.name}
    vs
    <img src="${awayTeam.logoURL}">
    ${awayTeam.name}
    <br>
    <small>${formatTime(game.time)}</small>
`;
            
            // Scroll to the home team schedule when clicked
            btn.onclick = () => showTeamSchedule(Object.keys(teams).find(k => teams[k].name === game.home));

            nav.appendChild(btn);
        });
    }
}


// 4. Save Schedule
function saveSchedule() {
    const rows = scheduleBuilder.querySelectorAll('.scheduleRow');
    const newSchedule = [];

    rows.forEach(row => {
        const inputs = row.querySelectorAll('input, select');

        if (
            inputs[0].value &&
            inputs[2].value &&
            inputs[3].value
        ) {
            newSchedule.push({
                date: inputs[0].value,
                time: inputs[1].value,
                home: inputs[2].value,
                away: inputs[3].value,
                score: inputs[4].value
            });
        }
    });

    for (const key in teams) {
        teams[key].schedule = newSchedule.filter(
            g => g.home === teams[key].name || g.away === teams[key].name
        );
    }

    db.ref('teams').set(teams)
        .then(() => {
            displayTeams();
            displayTodayGames();
            displayUpcomingGames();
            alert('Schedule saved!');
        })
        .catch(err => {
            console.error(err);
            alert('Error saving schedule');
        });
}

// ----------------------
// ADD TEAM WITH LOGO JS
// ----------------------
const addTeamBtn = document.getElementById('addTeamBtn');
const newTeamName = document.getElementById('newTeamName');
const newTeamLogo = document.getElementById('newTeamLogo');
const logoPreview = document.getElementById('logoPreview');

newTeamLogo.addEventListener('change', e => {
    const file = e.target.files[0];
    if(file){
        const reader = new FileReader();
        reader.onload = function(ev){ 
            logoPreview.src = ev.target.result; 
            logoPreview.style.display='block'; 
        }
        reader.readAsDataURL(file);
    }
});

addTeamBtn.addEventListener('click', () => {
    const name = newTeamName.value.trim();
    const logoURL = logoPreview.src;
    if(!name || !logoURL){ 
        alert('Enter team name and select a logo'); 
        return; 
    }

    const key = name.toLowerCase().replace(/\s+/g,'_');
    teams[key] = { name, logoURL, schedule: [] };

    db.ref('teams').set(teams).then(() => {
        displayTeams();
        alert('Team added successfully!');
        newTeamName.value = '';
        newTeamLogo.value = '';
        logoPreview.src = '';
        logoPreview.style.display = 'none';
    }).catch(err => alert('Error adding team: ' + err.message));
});

function displayUpcomingGames() {
    const track = document.getElementById('upcomingGamesTrack');
    track.innerHTML = '';

    const now = new Date();
    const todayStr =
        `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

    const todayGames = [];
    const futureGames = [];
    const addedGames = new Set();

    Object.values(teams).forEach(team => {
        const schedule = team.schedule || {};

        Object.values(schedule).forEach(game => {
            if (!game || !game.date) return;

            const home = game.home || game.teamB;
            const away = game.away || game.teamA;

            if (!home || !away) return;

            const uniqueKey = `${game.date}-${game.time || ''}-${home}-${away}`;

            if (addedGames.has(uniqueKey)) return;
            addedGames.add(uniqueKey);

            const fixedGame = {
                ...game,
                home,
                away
            };

            if (game.date === todayStr) {
                todayGames.push(fixedGame);
            } else if (game.date > todayStr) {
                futureGames.push(fixedGame);
            }
        });
    });

    let gamesToShow = todayGames;
    let labelText = "🏀 TODAY'S GAMES";

    if (gamesToShow.length === 0) {
        futureGames.sort((a,b)=>
            `${a.date} ${a.time || ''}`.localeCompare(`${b.date} ${b.time || ''}`)
        );

        if (futureGames.length > 0) {
            const nextDate = futureGames[0].date;
            gamesToShow = futureGames.filter(g => g.date === nextDate);
            labelText = "🏀 NEXT GAMES";
        }
    }

    if (!gamesToShow.length) {
        track.innerHTML = `<div class="gameTickerItem">No Games Scheduled</div>`;
        return;
    }

    track.innerHTML = `
        <div class="gameTickerItem">
            <strong>${labelText}</strong>
        </div>
    `;

    gamesToShow.forEach(game => {
        const homeTeam = Object.values(teams).find(t => t.name === game.home);
        const awayTeam = Object.values(teams).find(t => t.name === game.away);

        track.innerHTML += `
            <div class="gameTickerItem">
                <img src="${awayTeam?.logoURL || 'logo.png'}">
                ${game.away}

                <span style="opacity:.6">vs</span>

                <img src="${homeTeam?.logoURL || 'logo.png'}">
                ${game.home}

                <span style="color:#1da1f2;font-weight:700;">•</span>

                ${formatDate(game.date)}

                <span style="opacity:.7">|</span>

                ${formatTime(game.time)}
            </div>
        `;
    });

    track.innerHTML += track.innerHTML;
}





// Initial load
loadTeams();
</script>
</body>
</html>
